<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حال‌نامه</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f8f7e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حال‌نامه">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--h:150;--bg1:#f7f3ee;--bg2:#edf3f1;--card:#ffffff;--tx:#2f343c;--mut:#737a85;--ac:#4f8f7e;--ac2:#8f86bd;--bd:rgba(60,70,80,.12);--sh:0 1px 2px rgba(60,70,90,.08),0 10px 26px -16px rgba(60,70,90,.3);--bgl:92%;--sell:40%;--selt:#fff;--acT:#fff;--inp:#f3f5f5;--tonal:color-mix(in srgb,var(--ac) 11%,var(--card));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2130;--bg2:#222a3a;--card:#273044;--tx:#e9e7f1;--mut:#a3a8bb;--ac:#86bfae;--ac2:#a79fd6;--bd:rgba(255,255,255,.1);--sh:0 8px 24px -14px rgba(0,0,0,.6);--bgl:26%;--sell:62%;--selt:#14201c;--acT:#14201c;--inp:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bg1:#1b2130;--bg2:#222a3a;--card:#273044;--tx:#e9e7f1;--mut:#a3a8bb;--ac:#86bfae;--ac2:#a79fd6;--bd:rgba(255,255,255,.1);--sh:0 8px 24px -14px rgba(0,0,0,.6);--bgl:26%;--sell:62%;--selt:#14201c;--acT:#14201c;--inp:rgba(255,255,255,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;padding:12px 14px 116px;max-width:560px;margin-inline:auto;line-height:1.7}
section[hidden],#toast[hidden],.sheet[hidden]{display:none}
section{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:62px;height:62px;flex:none}
h1{font-size:23px;margin:0;line-height:1.3}
.sub{color:var(--mut);font-size:13px}
#thBtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center;box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.cardhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.cardhead svg{width:44px;height:44px;flex:none}
.micwrap{display:grid;place-items:center;padding:8px 0 2px}
#mic{width:92px;height:92px;border-radius:50%;border:0;background:var(--ac);color:var(--acT);display:grid;place-items:center;position:relative;box-shadow:0 12px 22px -8px var(--ac)}
#mic::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--ac);opacity:.25}
#mic.on{background:#d9798a;color:#fff}
#mic.on::after{border-color:#d9798a;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){#mic.on::after,section{animation:none}}
#msg{text-align:center;color:var(--mut);font-size:14px;min-height:26px;margin:8px 0 2px}
label{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--mut);margin:12px 2px 4px;min-height:40px}
.ed{background:none;border:0;color:var(--ac);font:inherit;font-size:14px;min-width:44px;min-height:40px;padding:0 8px}
textarea,select,input[type=date],input[type=time]{width:100%;border:1px solid var(--bd);border-radius:16px;background:var(--inp);color:var(--tx);padding:12px;font:inherit;min-height:48px}
textarea{min-height:92px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.wide{grid-column:1/-1}
.scale{display:flex;gap:7px}
.scale button{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit}
.scale button.sel{background:var(--ac);color:var(--acT);border-color:var(--ac)}
#cats{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
#cats::-webkit-scrollbar{display:none}
#cats .chip{flex:none}
#feels{background:var(--tonal);border-radius:20px;padding:8px;min-height:56px;align-content:flex-start}
#feels:empty::before{content:"یک دسته را انتخاب کن تا احساس‌هایش اینجا بیاید";color:var(--mut);font-size:13px;padding:8px}
#picked{display:grid;gap:8px;margin-top:10px}
.pk{background:var(--tonal);border-radius:18px;padding:10px 12px;border-inline-start:5px solid hsl(var(--h) 50% 62%)}
.pkh{display:flex;align-items:center;gap:8px}
.pkh b{flex:1}
.pkw{color:var(--mut);font-size:12.5px}
.pkh .x{background:none;border:0;color:var(--mut);font:inherit;font-size:17px;min-width:40px;min-height:40px;opacity:1;padding:0;margin:0}
.lvl{display:flex;gap:6px;margin-top:8px}
.lvl button{flex:1;min-height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit}
.lvl button.on{background:hsl(var(--h) 36% var(--sell));color:var(--selt);border-color:transparent}
.lvb{display:inline-block;min-width:22px;text-align:center;border-radius:999px;background:hsl(var(--h) 36% var(--sell));color:var(--selt);font-size:12px;margin-inline-start:6px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{display:inline-flex;align-items:center;min-height:42px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:999px;padding:0 16px;font:inherit;font-size:14.5px}
.chip.cat{background:hsl(var(--h) 38% var(--bgl));border-color:transparent}
.chip.sel{background:hsl(var(--h) 36% var(--sell));color:var(--selt);font-weight:700;border-color:transparent}
.x{cursor:pointer;opacity:.7;margin-inline-start:6px;padding:4px}
.btn{width:100%;min-height:56px;border-radius:20px;border:0;background:var(--ac);color:var(--acT);font:inherit;font-size:17px;font-weight:700;margin-top:18px;box-shadow:0 10px 20px -10px var(--ac)}
.ghost{width:100%;min-height:50px;border-radius:16px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit;margin-top:10px}
.ent{display:flex;gap:8px;background:var(--tonal);border-radius:16px;border-inline-start:5px solid hsl(var(--h) 50% 62%);padding:10px 12px;margin:8px 0}
.eb{flex:1;min-width:0}
.et{font-size:14.5px;overflow-wrap:anywhere}
.ea{display:flex;flex-direction:column;align-items:flex-end}
.meta{color:var(--mut);font-size:12.5px}
.del{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;min-width:48px;min-height:40px}
.empty{display:grid;justify-items:center;gap:6px;padding:14px 0;color:var(--mut);font-size:14px;text-align:center}
.empty svg{width:96px;height:72px}
.wkh{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wkh b{font-size:15px;text-align:center;flex:1}
.ibtn{min-width:46px;min-height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit;font-size:18px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.dayc{min-height:70px;border:0;border-radius:18px;background:var(--inp);color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0}
.dayc small{font-size:12px;color:var(--mut)}
.dayc b{font-size:17px;line-height:1.3}
.dayc.today b{color:var(--ac)}
.dayc.on{background:var(--ac);color:var(--acT)}
.dayc.on small,.dayc.on b{color:var(--acT)}
.dayc i{position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--ac2)}
.dayc.on i{background:var(--acT)}
.hr{display:flex;gap:8px;min-height:50px;border-top:1px dashed var(--bd);padding:6px 4px}
.hl{width:46px;flex:none;color:var(--mut);font-size:12px;padding-top:4px;text-align:center}
.hb{flex:1;min-width:0}
.hr.now{background:var(--tonal);border-radius:14px;border-top-color:transparent}
.hr.now .hl{color:var(--ac);font-weight:700}
details.card summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:700}
details.card summary::-webkit-details-marker{display:none}
details.card summary svg{width:34px;height:34px}
#rep p{margin:8px 0;font-size:15px}
.swrow{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.sw2{width:54px;height:32px;border-radius:999px;border:0;background:var(--inp);box-shadow:inset 0 0 0 1px var(--bd);position:relative;flex:none}
.sw2 i{position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:.2s}
.sw2.on{background:var(--ac)}
.sw2.on i{inset-inline-start:26px;background:var(--acT)}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92vw,520px);background:var(--ac);color:var(--acT);border-radius:20px;padding:12px 16px;z-index:30;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:space-between;gap:10px}
#toast button{border:0;border-radius:14px;background:rgba(255,255,255,.25);color:inherit;font:inherit;min-height:40px;padding:0 16px}
.bnav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92vw,520px);display:flex;gap:4px;padding:6px;border-radius:28px;background:var(--card);border:1px solid var(--bd);box-shadow:0 10px 30px -10px rgba(40,50,70,.35);z-index:10}
.bnav button{flex:1;min-height:56px;border:0;border-radius:22px;background:transparent;color:var(--mut);font:inherit;font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bnav button.on{background:var(--tonal);color:var(--ac);font-weight:700}
.bnav svg{width:24px;height:24px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;display:inline-block;box-shadow:0 0 0 1px var(--bd)}
.sw.sel,.bgsw.sel{border-color:var(--tx)}
.bgsw{padding:14px 18px;border-radius:14px;font-size:13px;color:var(--tx);border:3px solid transparent;box-shadow:0 0 0 1px var(--bd)}
.sheet{position:fixed;inset:0;background:rgba(20,25,35,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.box{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:var(--bg1);color:var(--tx);border-radius:28px 28px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.bh{display:flex;justify-content:space-between;align-items:center}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:16px;background:var(--inp);color:var(--tx);padding:12px;font:inherit;min-height:48px}
.addrow button{border:0;border-radius:16px;background:var(--ac);color:var(--acT);font:inherit;padding:0 20px;min-height:48px}
.appname{color:var(--ac);font-weight:800;font-size:15px}
.calcard{padding:0;overflow:hidden}
.banner{position:relative;height:118px;background:#dff0f6}
.banner svg{display:block;width:100%;height:118px}
.bt{position:absolute;inset-inline-start:14px;bottom:10px;background:rgba(255,255,255,.85);color:#2f343c;border-radius:14px;padding:4px 14px;display:flex;flex-direction:column;line-height:1.4}
.bt small{font-size:11.5px;color:#5b6470}
.calbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 0}
.mt{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--tx);font:inherit;font-size:19px;min-height:48px}
.cbtns{display:flex;gap:6px}
.ibtn.tod{font-size:14px;font-weight:700;border-radius:14px}
#monthWrap{padding:0 10px}
#monthWrap[hidden]{display:none}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh span{text-align:center;color:var(--mut);font-size:12.5px;padding:6px 0}
.mc{min-height:52px;border:0;background:none;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.mc span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:14.5px}
.mc.out{opacity:.35}
.mc.today span{box-shadow:inset 0 0 0 2px var(--ac)}
.mc.on span{background:var(--ac);color:var(--acT)}
.mc i{display:flex;gap:3px;height:6px}
.mc u{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 55% 52%)}
.seg{display:flex;gap:6px;margin:10px 14px 14px;background:var(--inp);border-radius:16px;padding:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:12px;background:none;color:var(--mut);font:inherit}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh);font-weight:700}
.ag{display:flex;gap:10px;padding:8px 0}
.agd{width:56px;flex:none;text-align:center;line-height:1.2;padding-top:2px}
.agd b{display:block;font-size:22px}
.agd small{font-size:11px;color:var(--mut)}
.ag.tdy .agd b,.ag.tdy .agd small{color:#4285f4}
.ag.on .agd b{color:var(--ac)}
.ag.tdy.on .agd b{color:#4285f4}
.agc{flex:1;min-width:0;position:relative}
.np{color:var(--mut);font-size:13.5px;padding:10px 0 6px}
.ag.tdy .np{border-bottom:2px solid #4285f4}
.gc{display:flex;gap:6px;background:hsl(var(--h) 45% 40%);color:#fff;border-radius:12px;padding:9px 12px;margin:0 0 8px}
.gcb{flex:1;min-width:0}
.gct{font-size:14px;overflow-wrap:anywhere}
.gcm{font-size:12px;opacity:.85}
.gca{display:flex;flex-direction:column;align-items:flex-end}
.gca button{background:none;border:0;color:#fff;font:inherit;font-size:12.5px;opacity:.9;min-height:36px;min-width:44px}
.gc .lvb{background:rgba(255,255,255,.28);color:#fff}
.hr{position:relative}
.nl{position:absolute;inset-inline:52px 0;height:2px;background:#4285f4;z-index:2}
.nl::before{content:"";position:absolute;inset-inline-start:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#4285f4}
.wvh,.wvb{display:grid;grid-template-columns:34px repeat(7,1fr)}
.wvh{position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--bd)}
.wd{border:0;background:none;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.wd small{font-size:11px;color:var(--mut)}
.wd b{font-size:16px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.wd.today b{color:var(--ac)}
.wd.on b{background:var(--ac);color:var(--acT)}
.wl{font-size:10px;color:var(--mut);text-align:center;transform:translateY(-7px)}
.wc{position:relative;border-inline-start:1px solid var(--bd);background-image:linear-gradient(var(--bd) 1px,transparent 1px);background-size:100% 44px}
.wc.today{background-color:var(--tonal)}
.wb{position:absolute;height:38px;border:0;border-radius:6px;background:hsl(var(--h) 45% 40%);color:#fff;font:inherit;font-size:10px;line-height:1.2;overflow:hidden;white-space:nowrap;padding:2px 3px;text-align:start}
.wnl{position:absolute;inset-inline:0;height:2px;background:#4285f4;z-index:2}
.fab{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));inset-inline-end:20px;width:58px;height:58px;border-radius:18px;border:0;background:var(--ac);color:var(--acT);font-size:32px;line-height:1;box-shadow:0 12px 24px -8px rgba(0,0,0,.4);z-index:12}
.fab[hidden]{display:none}
.editbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--tonal);border-radius:16px;padding:6px 14px;margin-bottom:10px;font-size:14px}
.editbar[hidden]{display:none}
.editbar button{border:0;background:none;color:var(--ac);font:inherit;min-height:40px;padding:0 10px}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span id="mascot"></span><div><div class="appname">حال‌نامه</div><h1 id="hi">سلام</h1><div class="sub" id="now"></div></div></div>
  <button type="button" id="thBtn" data-ed="theme" aria-label="ظاهر برنامه"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>

<section id="tab-add">
 <div class="card">
  <div id="editBar" class="editbar" hidden><span id="editTx"></span><button type="button" id="editCancel">انصراف</button></div>
  <div class="micwrap"><button id="mic" aria-label="ضبط صدا"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
  <div id="msg">هر چه حس می‌کنی بگو؛ قضاوتی در کار نیست.</div>

  <label>الان چه احساسی داری؟ <button type="button" class="ed" data-ed="feel">✎ ویرایش</button></label>
  <div id="cats"></div><div class="chips" id="feels"></div>
  <div id="picked"></div>
  <textarea id="text" placeholder="اگر خواستی با صدای بلند بگو یا اینجا بنویس…"></textarea>

  <div class="row">
    <div class="wide"><label>زمان ثبت <span class="meta">(اگر دست نزنی، همین الان ثبت می‌شود)</span></label><div class="row"><input type="date" id="whenD"><input type="time" id="whenT"></div></div>
    <div><label>سپر دفاعی <button type="button" class="ed" data-ed="shield">✎</button></label><select id="shield"></select></div>
    <div><label>فعالیت <button type="button" class="ed" data-ed="activity">✎</button></label><select id="activity"></select></div>
    <div id="gWrap"><label>هدف (دقیقه) <button type="button" class="ed" data-ed="goal">✎</button></label><select id="goal"></select></div>
    <div><label>زمان ریکاوری <button type="button" class="ed" data-ed="rec">✎</button></label><select id="rec"></select></div>
    <div class="wide"><label>تنش محیطی</label><select id="env"></select></div>
  </div>
  <label>شدت فشار احساسی (۱ کم تا ۵ خیلی زیاد)</label><div class="scale" id="press"></div>
  <button class="btn" id="save">ذخیره</button>
 </div>
 <div class="card"><b>یادداشت‌های امروز</b><div id="list"></div></div>
</section>

<section id="tab-cal" hidden>
 <div class="card calcard">
  <div class="banner"><div id="bannerArt"></div><div class="bt"><b id="bMonth"></b><small id="bSeason"></small></div></div>
  <div class="calbar">
   <button type="button" class="mt" id="mtBtn"><b id="mTitle"></b><span id="mArrow">▴</span></button>
   <div class="cbtns"><button type="button" class="ibtn" id="mPrev" aria-label="ماه قبل">→</button><button type="button" class="ibtn" id="mNext" aria-label="ماه بعد">←</button><button type="button" class="ibtn tod" id="wkToday" aria-label="امروز"><span id="todNum"></span></button></div>
  </div>
  <div id="monthWrap"><div class="mh"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div><div class="mg" id="mgrid"></div></div>
  <div class="seg" id="viewSeg"><button type="button" data-v="agenda" class="on">برنامه</button><button type="button" data-v="day">روز</button><button type="button" data-v="week">هفته</button></div>
 </div>
 <details class="card"><summary><span id="starArt"></span>گزارش پایان همین روز</summary><div id="rep" style="margin-top:6px"></div></details>
 <div class="card"><b id="dayTitle"></b><div id="cal"></div></div>
</section>

<section id="tab-more" hidden>
 <div class="card">

<script>
(()=>{
const PROC="اهمال‌کاری";
const DEF={
 shield:["تا حدی جدا","مشاهده‌گر","آسیب‌پذیر","در حال تلاش","مرز خاکی"],
 activity:["پایان‌نامه","مهاجرت","کارهای روزمره","پیاده‌روی","استراحت",PROC],
 goal:["15","30","45","60"],rec:["0","5","10","15"],
 help:["گفتن با صدای بلند","نام‌گذاری احساس","نفس عمیق","حرکت یا پیاده‌روی","شروع یک کار کوچک","تماس با یک آدم امن","نوشتن"],
 env:["۰: محیط آرام","۱: تنش بیرونی کم","۲: محیط متشنج"],
 feel:{
  "فعال (اضطراب و انرژی)":["اضطراب","نگرانی","بی‌قراری","هیجان مثبت","اشتیاق"],
  "ثقل (عواطف و روابط)":["دلتنگی","عشق","غم عمیق","احساس تنهایی","حس حمایت‌نشدن"],
  "افت انرژی":["خستگی","بی‌حوصلگی","خواب‌آلودگی","مه ذهنی","نیاز به سکوت"],
  "بلاتکلیفی و ذهن":["بلاتکلیفی","سردرگمی","ترس از شروع","کمال‌گرایی","حواس‌پرتی"],
  "خنثی":["آرام","نرمال","تمرکز خالی"],
  "خانواده (دعوای پدر و مادر)":["اضطراب از دعوا","ترس و تنش","احساس گناه","درماندگی","نیاز به آرامش"],
  "کار و روزمره":["فشار کارها","احساس عقب‌ماندن","ترس از اشتباه","بی‌انگیزگی","خستگی ذهنی"],
  "آینده":["ترس از آینده","بی‌اطمینانی","ناامیدی","نگرانی از تنها ماندن","امید کم‌رنگ"],
  "تحصیل":["ترس از قضاوت","احساس ناکافی بودن","فشار ضرب‌الاجل","کمال‌گرایی در درس","غرور از پیشرفت"],
  "همسر: دیوار سکوت":["دیوار سکوت","نادیده‌گرفته‌شدن","تنهایی کنار همسر","اضطراب انتظار پاسخ","نامرئی بودن","ترس از رها شدن"],
  "همسر: محبت و نوازش":["تشنه‌ی محبت","نیاز به نوازش و نزدیکی","احساس طردشدگی","شرم از خواستن","دلتنگی در کنار هم","نیاز به اطمینان"],
  "همسر: امنیت و آینده":["ناامنی روانی","ناامنی مالی","ناامنی عاطفی و روحی","بی‌اطمینانی از آینده‌ی مشترک","تنها ماندن در تصمیم‌ها","بی‌پشتوانگی"],
  "واکنش‌های من":["وسوسه‌ی پیگیری و اصرار","حساسیت به نشانه‌ها","خودسرزنشی: من زیادی می‌خواهم؟","خشم و دلخوری","غم و سوگ رابطه","خستگی از تلاش","تردید درباره‌ی ماندن","آرام کردن خودم"]
 }
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LST={shield:LS("l_shield",DEF.shield.slice()),activity:LS("l_activity",LS("acts_v1",DEF.activity.slice())),goal:LS("l_goal",DEF.goal.slice()),rec:LS("l_rec",DEF.rec.slice()),help:LS("l_help",DEF.help.slice())};
if(!LST.activity.includes(PROC))LST.activity.push(PROC);
const FEEL=(()=>{let f=LS("feel_v3",null);if(f)return f;f=LS("feel_v2",null);
 if(f){delete f["همسر و رابطه"];Object.keys(DEF.feel).slice(-4).forEach(k=>f[k]=DEF.feel[k].slice())}else f=JSON.parse(JSON.stringify(DEF.feel));
 SV("feel_v3",f);return f})();
const HUES=[150,12,205,265,40,330,180,95,25,240,300,60,120,350];
const EMO=["⚡","💗","🌙","🌀","🍃","💞","🏠","🧺","🔮","📚","🤍","🧱","🎈","🌧️"];
const hue=c=>HUES[Math.max(0,Object.keys(FEEL).indexOf(c))%HUES.length];

function fillSel(k,sel){
  const e=$(k);if(!e)return;const cur=sel||e.value;
  e.innerHTML=LST[k].map(v=>`<option>${esc(v)}</option>`).join("");
  if(LST[k].includes(cur))e.value=cur;
  if(k==="activity")toggle();
}
function toggle(){const p=$("activity").value===PROC;$("gWrap").style.display=p?"none":""}
["shield","activity","goal","rec"].forEach(k=>fillSel(k));
$("env").innerHTML=DEF.env.map(v=>`<option>${v}</option>`).join("");
$("activity").onchange=toggle;

const val={perf:4,press:3};
function scale(id,key){
  const el=$(id);
  el.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join("");
  const paint=()=>[...el.children].forEach(b=>b.classList.toggle("sel",+b.dataset.n===val[key]));
  el.onclick=e=>{if(e.target.dataset.n){val[key]=+e.target.dataset.n;paint()}};
  paint();
}
scale("press","press");

const picked=new Map(),lvl=new Map();let curCat=null,editT=null,whenTouched=false;
const LVW=["خیلی کم","کم","متوسط","زیاد","خیلی زیاد"];
function drawFeel(){
  const has=c=>[...picked.values()].includes(c)?" ✓":"";
  $("cats").innerHTML=Object.keys(FEEL).map(c=>`<button type="button" class="chip cat${c===curCat?" sel":""}" style="--h:${hue(c)}" data-c="${esc(c)}">${EMO[Object.keys(FEEL).indexOf(c)%EMO.length]} ${esc(c)}${has(c)}</button>`).join("");
  $("picked").innerHTML=[...picked].map(([f,c])=>{const n=lvl.get(f)||3;return `<div class="pk" style="--h:${hue(c)}"><div class="pkh"><b>${esc(f)}</b><span class="pkw">${LVW[n-1]}</span><button type="button" class="x" data-rmf="${esc(f)}" aria-label="حذف">✕</button></div><div class="lvl">${[1,2,3,4,5].map(i=>`<button type="button" class="${i<=n?"on":""}" data-f="${esc(f)}" data-l="${i}">${i}</button>`).join("")}</div></div>`}).join("");
  $("feels").innerHTML=curCat?(FEEL[curCat]||[]).map(f=>`<button type="button" class="chip cat${picked.has(f)?" sel":""}" style="--h:${hue(curCat)}" data-f="${esc(f)}">${esc(f)}${picked.has(f)?" · "+(lvl.get(f)||3):""}</button>`).join(""):"";
}
$("cats").onclick=e=>{const c=e.target.dataset.c;if(c){curCat=curCat===c?null:c;drawFeel()}};
$("picked").onclick=e=>{const b=e.target.closest("[data-l]");if(b){lvl.set(b.dataset.f,+b.dataset.l);drawFeel();return}const r=e.target.closest("[data-rmf]");if(r){picked.delete(r.dataset.rmf);lvl.delete(r.dataset.rmf);drawFeel()}};
$("feels").onclick=e=>{const f=e.target.dataset.f;if(f){if(picked.has(f)){picked.delete(f);lvl.delete(f)}else{picked.set(f,curCat);lvl.set(f,3)}drawFeel()}};
drawFeel();

// ویرایش گزینه‌ها
const TT={shield:"ویرایش سپر دفاعی",activity:"ویرایش فعالیت‌ها",goal:"ویرایش هدف (دقیقه)",rec:"ویرایش زمان ریکاوری (دقیقه)",feel:"ویرایش احساسات",help:"ویرایش راهکارهای کمک‌کننده"};
let edKey=null,ev={t:null,after:0,perf:0,noPerf:false,help:new Set()};
function drawEd(){
  const k=edKey,b=$("sBody");
  if(k==="theme"){drawTheme();return}
  const chip=(t,r,lock,sel)=>`<span class="chip${sel?" sel":""}" ${sel===undefined?"":`data-sel="${esc(t)}"`}>${esc(t)}${lock?"":` <b class="x" data-rm="${esc(r)}">✕</b>`}</span>`;
  const add=(id,ph,act,num)=>`<div class="addrow"><input id="${id}" ${num?'inputmode="numeric"':""} placeholder="${ph}"><button type="button" data-act="${act}">افزودن</button></div>`;
  $("sTitle").textContent=TT[k];
  if(k==="feel"){
    b.innerHTML=`<label>دسته‌ها (برای دیدن و ویرایش احساس‌ها، روی یک دسته بزن)</label><div class="chips">${Object.keys(FEEL).map(c=>chip(c,"c:"+c,false,c===curCat)).join("")}</div>${add("edCat","دسته‌ی جدید","addcat")}`+
    (curCat?`<label>احساس‌های «${esc(curCat)}»</label><div class="chips">${FEEL[curCat].map(f=>chip(f,"f:"+f,false)).join("")}</div>${add("edFeel","احساس جدید","addfeel")}`:"");
  }else{
    const num=k==="goal"||k==="rec";
    b.innerHTML=`<div class="chips">${LST[k].map(v=>chip(v,v,k==="activity"&&v===PROC)).join("")}</div>`+(k==="activity"?`<div class="meta">«اهمال‌کاری» ثابت است، چون هدف و عملکرد را مخفی می‌کند.</div>`:"")+add("edIn",num?"عدد جدید (دقیقه)":"گزینه‌ی جدید","add",num)+(k==="help"&&ev.t?`<button type="button" class="ghost" data-act="back">بازگشت به ارزیابی</button>`:"");
  }
}
function drawEval(){
  $("sTitle").textContent="این ثبت چقدر کمک کرد؟";
  $("sBody").innerHTML=`<label>الان شدت فشار احساسی‌ات چقدر است؟ (۱ تا ۵)</label><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="${ev.after===n?"sel":""}" data-a="${n}">${n}</button>`).join("")}</div>
  ${ev.noPerf?"":`<label>میزان عملکردت در این ساعت (۱ ضعیف تا ۵ عالی)</label><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="${ev.perf===n?"sel":""}" data-p="${n}">${n}</button>`).join("")}</div>`}
  <label>چه چیزی کمک کرد؟ (چند گزینه می‌شود) <button type="button" class="ed" data-ed="help">✎ ویرایش</button></label>
  <div class="chips">${LST.help.map(h=>`<span class="chip${ev.help.has(h)?" sel":""}" data-h="${esc(h)}">${esc(h)}</span>`).join("")}</div>
  <button type="button" class="btn" data-act="evsave">ثبت اثر</button>`;
}
function openEval(tm){const x=load().find(y=>y.t===tm)||{};ev={t:tm,after:+x.after||0,perf:+x.perf||0,noPerf:x.activity===PROC,help:new Set(x.helped?x.helped.split("، "):[])};edKey="eval";drawEval();$("sheet").hidden=false}
function openEd(k){edKey=k;drawEd();$("sheet").hidden=false}
document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-ed]");if(el)openEd(el.dataset.ed)});
$("sClose").onclick=()=>{$("sheet").hidden=true};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};
$("sBody").onkeydown=e=>{if(e.key==="Enter"){const a=e.target.parentNode&&e.target.parentNode.querySelector("[data-act]");if(a)a.click()}};
$("sBody").onclick=e=>{
  const t=e.target,rm=t.dataset.rm,act=t.dataset.act,sel=t.dataset.sel,k=edKey;
  const v=id=>($(id)&&$(id).value||"").trim();
  if(edKey==="theme"){themeClick(t,act);return}
  if(act==="back"){edKey="eval";drawEval();return}
  if(edKey==="eval"){
    if(t.dataset.a)ev.after=+t.dataset.a;
    else if(t.dataset.p)ev.perf=+t.dataset.p;
    else if(t.dataset.h!==undefined){ev.help.has(t.dataset.h)?ev.help.delete(t.dataset.h):ev.help.add(t.dataset.h)}
    else if(act==="evsave"){
      if(!ev.after){return}
      const a=load(),x=a.find(y=>y.t===ev.t);
      if(x){x.after=ev.after;x.helped=[...ev.help].join("، ");if(!ev.noPerf&&ev.perf)x.perf=ev.perf}
      SV(KEY,a);$("sheet").hidden=true;render();$("msg").textContent="اثر این ثبت هم نوشته شد.";return;
    }
    drawEval();return;
  }
  if(sel!==undefined){curCat=sel;drawFeel();drawEd();return}
  if(rm!==undefined){
    if(k==="feel"){
      if(rm.startsWith("c:")){const c=rm.slice(2);delete FEEL[c];for(const [f,cc] of [...picked])if(cc===c)picked.delete(f);if(curCat===c)curCat=null}
      else{const f=rm.slice(2);FEEL[curCat]=FEEL[curCat].filter(x=>x!==f);picked.delete(f)}
      SV("feel_v3",FEEL);drawFeel();
    }else{
      if(k==="activity"&&rm===PROC)return;
      LST[k]=LST[k].filter(x=>x!==rm);SV("l_"+k,LST[k]);fillSel(k);
    }
    drawEd();return;
  }
  if(act==="addcat"){const n=v("edCat");if(n&&!FEEL[n]){FEEL[n]=[];curCat=n;SV("feel_v3",FEEL);drawFeel()}}
  else if(act==="addfeel"){const n=v("edFeel");if(n&&curCat&&!FEEL[curCat].includes(n)){FEEL[curCat].push(n);SV("feel_v3",FEEL);drawFeel()}}
  else if(act==="add"){
    let n=v("edIn");const num=k==="goal"||k==="rec";
    if(num)n=n.replace(/\D/g,"");
    if(n&&!LST[k].includes(n)){LST[k].push(n);if(num)LST[k].sort((a,b)=>a-b);SV("l_"+k,LST[k]);fillSel(k,n)}
  }
  if(act==="addcat"||act==="addfeel"||act==="add"){drawEd();const f=$(act==="addcat"?"edCat":act==="addfeel"?"edFeel":"edIn");if(f)f.focus()}
};

// گزارش پایان روز
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const topN=(arr,n)=>{const m={};arr.forEach(k=>m[k]=(m[k]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)};
function report(){
  const td=sameDay(vd,new Date()),w=td?"امروز":"در این روز",today=dstr(vd),a=load().filter(x=>dstr(new Date(x.t))===today);
  if(!a.length)return td?"<p>امروز هنوز ثبتی نداری. هر وقت آماده بودی، یک ثبت کوچک کافی است.</p>":"<p>در این روز ثبتی نبود.</p>";
  const e=a.filter(x=>x.after),P=[];
  P.push(`<p>📝 ${a.length} ثبت ${w}${e.length<a.length?` (اثر ${a.length-e.length} مورد هنوز ثبت نشده)`:""}</p>`);
  const fl=topN(a.flatMap(x=>x.feel?x.feel.split("، "):[]),3);
  if(fl.length)P.push(`<p>🌿 پرتکرارترین احساس‌ها: ${fl.map(f=>esc(f[0])+" ("+f[1]+")").join("، ")}</p>`);
  const lvs=a.flatMap(x=>x.lv?Object.entries(x.lv).map(([f,n])=>[f,+n]):[]).sort((p,q)=>q[1]-p[1]);
  if(lvs.length)P.push(`<p>🔥 شدیدترین احساس: ${esc(lvs[0][0])} (${lvs[0][1]} از ۵)</p>`);
  const pr=a.filter(x=>x.activity===PROC).length;
  if(pr)P.push(`<p>⏳ ${pr} ثبت در حال اهمال‌کاری بود.</p>`);
  const pf=a.filter(x=>x.perf);if(pf.length)P.push(`<p>🎯 میانگین عملکرد: ${avg(pf.map(x=>+x.perf)).toFixed(1)} از ۵</p>`);
  if(!e.length){P.push("<p><b>اثر ثبت‌ها:</b> هنوز ارزیابی نشده. روی «ثبت اثر» هر یادداشت بزن تا ببینیم چقدر کمک کرده.</p>");return P.join("")}
  const b=avg(e.map(x=>x.press)),c=avg(e.map(x=>x.after)),d=b-c;
  const better=e.filter(x=>x.after<x.press).length,worse=e.filter(x=>x.after>x.press).length,same=e.length-better-worse;
  P.push(`<p>📉 میانگین فشار احساسی: ${b.toFixed(1)} قبل ← ${c.toFixed(1)} بعد</p><p>✅ ${better} بهتر · ➖ ${same} بدون تغییر · ⚠️ ${worse} بدتر</p>`);
  const h=topN(e.filter(x=>x.after<x.press&&x.helped).flatMap(x=>x.helped.split("، ")),3);
  if(h.length)P.push(`<p>💡 بیشتر کمک کرد: ${h.map(x=>esc(x[0])).join("، ")}</p>`);
  P.push("<p><b>"+(d>=0.5?w+" بعد از ثبت‌ها فشار احساسی‌ات به‌طور میانگین پایین آمد؛ ثبت کردن به نظر برایت مؤثر بود.":d>-0.5?"تغییر محسوسی در فشار دیده نشد؛ این هم اطلاعات خوبی است برای اینکه فردا چه چیز دیگری امتحان کنی.":"بعد از ثبت‌ها فشار بیشتر شد. شاید لحظه‌های سختی بودند؛ اگر تکرار شد، با یک آدم مطمئن هم حرف بزن.")+"</b></p>");
  return P.join("");
}


// تاریخ و سلام
const pad=n=>String(n).padStart(2,"0");
const fday=d=>d.toLocaleDateString("fa-IR-u-ca-gregory",{weekday:"long",day:"numeric",month:"long"});
const dstr=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const day=d=>d.toLocaleDateString("en-US",{weekday:"long"});
function tick(){
  const d=new Date(),h=d.getHours();
  $("hi").textContent=h<5?"شب بخیر":h<12?"صبح بخیر":h<17?"ظهر بخیر":h<21?"عصر بخیر":"شب بخیر";
  $("now").textContent=fday(d)+" · "+d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});
  setNow();
}
tick();setInterval(tick,30000);

// تشخیص گفتار (وب + اندروید)
const IS_NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let on=false,base="",wantOn=false,rec=null,lastErr=false,quiet=0,nBound=false;
const setMsg=s=>{$("msg").textContent=s};
const stopUI=()=>{on=false;wantOn=false;$("mic").classList.remove("on")};
const DONE="ضبط تمام شد. اگر لازم بود ویرایش کن و ذخیره بزن.";
const ERR={
 "not-allowed":"اجازه‌ی میکروفون داده نشده؛ در Chrome روی آیکون قفل کنار آدرس بزن، Permissions و بعد Microphone را روی Allow بگذار.",

function webToggle(){
  if(!SR){setMsg("این مرورگر تشخیص گفتار ندارد؛ از Chrome گوشی استفاده کن یا با کیبورد بنویس.");return}
  if(!window.isSecureContext){setMsg("میکروفون فقط روی آدرس https کار می‌کند؛ برنامه را از آدرس GitHub Pages در Chrome باز کن، نه از فایل یا پیش‌نمایش.");return}
  if(wantOn){wantOn=false;try{rec&&rec.stop()}catch(e){}return}
  base=$("text").value;wantOn=true;lastErr=false;quiet=0;startWeb();
}
function startWeb(){
  rec=new SR();rec.lang="fa-IR";rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
  rec.onstart=()=>{on=true;$("mic").classList.add("on");setMsg("دارم گوش می‌دهم… آرام و بلند بگو")};
  rec.onresult=e=>{quiet=0;const r=e.results[e.results.length-1],s=r[0].transcript;$("text").value=(base+" "+s).trim();if(r.isFinal)base=$("text").value};
  rec.onerror=e=>{
    if(e.error==="aborted")return;
    if(e.error==="no-speech"){if(++quiet>=3){wantOn=false;lastErr=true;setMsg("صدایی شنیده نشد؛ دوباره دکمه را بزن.")}return}
    wantOn=false;lastErr=true;setMsg(ERR[e.error]||("خطای میکروفون: "+e.error));
  };
  rec.onend=()=>{
    if(wantOn){setTimeout(()=>{if(wantOn){try{startWeb()}catch(e){stopUI()}}},250)}
    else{stopUI();if(!lastErr)setMsg(DONE)}
  };
  try{rec.start()}catch(e){wantOn=false;stopUI();setMsg("شروع میکروفون ممکن نشد؛ صفحه را ببند و دوباره باز کن.")}
}
const getNSR=()=>{try{return (Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition)||(Capacitor.registerPlugin&&Capacitor.registerPlugin("SpeechRecognition"))||null}catch(e){return null}};
async function nativeToggle(){
  const N=getNSR();
  if(!N){if(SR)return webToggle();setMsg("افزونه‌ی میکروفون در این نسخه‌ی برنامه فعال نیست؛ از Chrome و آدرس سایت استفاده کن.");return}
  if(!nBound){
    nBound=true;
    N.addListener("partialResults",d=>{const m=((d&&(d.matches||d.value))||[])[0];if(m)$("text").value=(base+" "+m).trim()});
    N.addListener("listeningState",d=>{if(d&&d.status==="stopped"){stopUI();setMsg("ضبط تمام شد. برای ادامه دوباره بزن؛ بعد ذخیره کن.")}});
  }
  if(on){try{await N.stop()}catch(e){}stopUI();setMsg(DONE);return}
  try{
    const a=await N.available();
    if(a&&a.available===false){setMsg("سرویس تشخیص گفتار گوگل روی این گوشی فعال نیست؛ برنامه‌ی Google را به‌روز یا فعال کن.");return}
    let p=await N.checkPermissions();
    if(p.speechRecognition!=="granted")p=await N.requestPermissions();
    if(p.speechRecognition!=="granted"){setMsg("اجازه‌ی میکروفون داده نشد؛ از تنظیمات گوشی، Permissions و بعد Microphone فعالش کن.");return}
  }catch(e){setMsg("خطا در آماده‌سازی میکروفون: "+((e&&e.message)||e));return}
  base=$("text").value;on=true;$("mic").classList.add("on");setMsg("دارم گوش می‌دهم… آرام و بلند بگو");
  const run=l=>N.start(Object.assign({maxResults:1,partialResults:true,popup:false},l?{language:l}:{}));
  try{
    let r;
    try{r=await run("fa-IR")}catch(e1){if(/language|support/i.test(String((e1&&e1.message)||e1)))r=await run("");else throw e1}
    if(r&&r.matches&&r.matches[0])$("text").value=(base+" "+r.matches[0]).trim();
  }catch(e){stopUI();setMsg("خطای تشخیص گفتار: "+((e&&e.message)||e))}
}

  if(n==="add"&&!on)$("msg").textContent="هر چه حس می‌کنی بگو؛ قضاوتی در کار نیست.";
  $("fab").hidden=n!=="cal";if(n==="cal"){render();setTimeout(scrollNow,60)}else window.scrollTo(0,0)}
["add","cal","more"].forEach(k=>$("nav-"+k).onclick=()=>showTab(k));
remUI();if(REM.on&&!IS_NATIVE&&REM.keep)wakeOn();
applyTheme();
render();
if(!IS_NATIVE&&"serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
