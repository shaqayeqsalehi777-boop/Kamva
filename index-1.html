<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یادداشت احساس</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5f9585">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="احساس">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--h:150;--bg1:#f4ede6;--bg2:#e6eef0;--card:rgba(255,255,255,.8);--tx:#3b4049;--mut:#7b8089;--ac:#5f9585;--ac2:#8f86bd;--bd:rgba(80,90,100,.16);--sh:0 6px 22px rgba(90,100,120,.12);--bgl:90%;--sell:40%;--selt:#fff;--acT:#fff;--inp:rgba(255,255,255,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d2433;--bg2:#252b3d;--card:rgba(44,52,72,.82);--tx:#e9e7f1;--mut:#a3a8bb;--ac:#86bfae;--ac2:#a79fd6;--bd:rgba(255,255,255,.12);--sh:0 6px 22px rgba(0,0,0,.3);--bgl:26%;--sell:62%;--selt:#14201c;--acT:#14201c;--inp:rgba(255,255,255,.07)}}
:root[data-theme="dark"]{--bg1:#1d2433;--bg2:#252b3d;--card:rgba(44,52,72,.82);--tx:#e9e7f1;--mut:#a3a8bb;--ac:#86bfae;--ac2:#a79fd6;--bd:rgba(255,255,255,.12);--sh:0 6px 22px rgba(0,0,0,.3);--bgl:26%;--sell:62%;--selt:#14201c;--acT:#14201c;--inp:rgba(255,255,255,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;padding:14px 14px 40px;max-width:560px;margin-inline:auto;line-height:1.7}
.hero{display:flex;align-items:center;gap:14px;margin:6px 2px 16px}
.hero svg{border-radius:24px;flex:none;box-shadow:var(--sh)}
h1{font-size:21px;margin:0}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
#mic{width:96px;height:96px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--ac),var(--ac2));color:var(--acT);display:grid;place-items:center;margin:6px auto 8px;box-shadow:0 10px 26px rgba(95,149,133,.4)}
#mic.on{animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.07);box-shadow:0 0 0 14px rgba(143,134,189,.2),0 0 0 30px rgba(143,134,189,.1)}}
@media(prefers-reduced-motion:reduce){#mic.on{animation:none}}
#msg{text-align:center;color:var(--mut);font-size:13.5px;min-height:24px;margin-bottom:4px}
label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin:14px 2px 6px}
.ed{background:none;border:0;color:var(--ac);font:inherit;font-size:12.5px;padding:2px 6px}
textarea,select,input{width:100%;border:1px solid var(--bd);border-radius:14px;background:var(--inp);color:var(--tx);padding:11px;font:inherit}
textarea{min-height:100px;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.wide{grid-column:1/-1}
.scale{display:flex;gap:7px}
.scale button{flex:1;padding:10px 0;border-radius:14px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit}
.scale button.sel{background:var(--ac);color:var(--acT);border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
.chip{border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px}
.chip.cat{background:hsl(var(--h) 38% var(--bgl));border-color:transparent}
.chip.sel{background:hsl(var(--h) 36% var(--sell));color:var(--selt);font-weight:700;border-color:transparent}
.x{cursor:pointer;opacity:.7;margin-inline-start:4px}
.btn{width:100%;padding:14px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acT);font:inherit;font-size:16px;margin-top:16px;box-shadow:0 6px 16px rgba(95,149,133,.3)}
.ghost{width:100%;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit;margin-top:9px}
.ent{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--bd);font-size:14.5px}
.ent:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:10px;flex:none;background:hsl(var(--h) 45% 62%)}
.meta{color:var(--mut);font-size:12px}
.del{margin-inline-start:auto;background:none;border:0;color:var(--mut);font-size:12.5px;align-self:flex-start}
#rep p{margin:6px 0;font-size:14px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;display:inline-block;box-shadow:0 0 0 1px var(--bd)}
.sw.sel,.bgsw.sel{border-color:var(--tx)}
.bgsw{padding:14px 18px;border-radius:14px;font-size:13px;color:var(--tx);border:3px solid transparent;box-shadow:0 0 0 1px var(--bd)}
#thBtn{margin-inline-start:auto;font-size:21px;background:var(--card);border:1px solid var(--bd);border-radius:50%;width:46px;height:46px;box-shadow:var(--sh)}
.nav{display:flex;align-items:center;gap:8px;margin:10px 0}
.nav input{flex:1;padding:8px;min-width:0}
.sheet{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.box{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:var(--bg1);color:var(--tx);border-radius:26px 26px 0 0;padding:16px 16px calc(26px + env(safe-area-inset-bottom,0px))}
.bh{display:flex;justify-content:space-between;align-items:center}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow button{border:0;border-radius:14px;background:var(--ac);color:var(--acT);font:inherit;padding:0 18px}
</style>
</head>
<body>
<div class="hero">
  <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" fill="#e7dff0"/><circle cx="36" cy="38" r="26" fill="#f2c9a5" opacity=".3"/><circle cx="36" cy="38" r="16" fill="#f2c9a5"/><path d="M0 58Q18 42 36 54T72 48V72H0Z" fill="#a6c9bb"/><path d="M0 66Q22 53 40 62T72 59V72H0Z" fill="#5f9585"/></svg>
  <div><h1 id="hi">سلام</h1><div class="sub" id="now"></div></div>
  <button type="button" id="thBtn" data-ed="theme" aria-label="ظاهر برنامه">🎨</button>
</div>

<div class="card">
  <button id="mic" aria-label="ضبط صدا"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div id="msg">هر چه حس می‌کنی بگو؛ قضاوتی در کار نیست.</div>

  <label>الان چه احساسی داری؟ <button type="button" class="ed" data-ed="feel">✎ ویرایش</button></label>
  <div class="chips" id="cats"></div><div class="chips" id="feels"></div>
  <textarea id="text" placeholder="اگر خواستی با صدای بلند بگو یا اینجا بنویس…"></textarea>

  <div class="row">
    <div><label>سپر دفاعی <button type="button" class="ed" data-ed="shield">✎</button></label><select id="shield"></select></div>
    <div><label>فعالیت <button type="button" class="ed" data-ed="activity">✎</button></label><select id="activity"></select></div>
    <div id="gWrap"><label>هدف (دقیقه) <button type="button" class="ed" data-ed="goal">✎</button></label><select id="goal"></select></div>
    <div><label>زمان ریکاوری <button type="button" class="ed" data-ed="rec">✎</button></label><select id="rec"></select></div>
    <div class="wide"><label>تنش محیطی</label><select id="env"></select></div>
  </div>
  <div id="pWrap"><label>عملکرد (۱ تا ۵)</label><div class="scale" id="perf"></div></div>
  <label>شدت فشار احساسی (۱ تا ۵)</label><div class="scale" id="press"></div>
  <button class="btn" id="save">ذخیره</button>
</div>

<div class="card"><b id="lTitle">یادداشت‌های امروز</b>
  <div class="nav"><button type="button" class="ed" id="dPrev">→ روز قبل</button><input type="date" id="dPick"><button type="button" class="ed" id="dNext">روز بعد ←</button></div>
  <div class="chips" id="dDays"></div>
  <button type="button" class="ghost" id="dToday" hidden style="margin:0 0 6px">برگشت به امروز</button>
  <div id="list"></div></div>

<div class="card"><b>گزارش پایان روز</b><div id="rep" style="margin-top:6px"></div><button class="ghost" id="repBtn">نمایش گزارش این روز</button></div>

<div class="card">
  <button class="ghost" id="csv" style="margin-top:0">دانلود فایل اکسل (CSV)</button>
  <button class="ghost" id="copy">کپی برای چسباندن در Google Sheets</button>
  <button class="ghost" id="rem">یادآوری هر یک ساعت: خاموش</button>
</div>

<div class="sheet" id="sheet" hidden><div class="box">
  <div class="bh"><b id="sTitle"></b><button class="ed" id="sClose">بستن ✕</button></div>
  <div id="sBody"></div>
</div></div>

<input type="file" id="thImg" accept="image/*" hidden>
<script>
(()=>{
const PROC="اهمال‌کاری";
const DEF={
 shield:["تا حدی جدا","مشاهده‌گر","آسیب‌پذیر","در حال تلاش","مرز خاکی"],
 activity:["پایان‌نامه","مهاجرت","کارهای روزمره","پیاده‌روی","استراحت",PROC],
 goal:["15","30","45","60"],rec:["0","5","10","15"],
 help:["گفتن با صدای بلند","نام‌گذاری احساس","نفس عمیق","حرکت یا پیاده‌روی","شروع یک کار کوچک","تماس با یک آدم امن","نوشتن"],
 env:["۰: محیط آرام","۱: تنش بیرونی کم","۲: محیط متشنج"],
 feel:{
  "فعال (اضطراب و انرژی)":["اضطراب","نگرانی","بی‌قراری","هیجان مثبت","اشتیاق"],
  "ثقل (عواطف و روابط)":["دلتنگی","عشق","غم عمیق","احساس تنهایی","حس حمایت‌نشدن"],
  "افت انرژی":["خستگی","بی‌حوصلگی","خواب‌آلودگی","مه ذهنی","نیاز به سکوت"],
  "بلاتکلیفی و ذهن":["بلاتکلیفی","سردرگمی","ترس از شروع","کمال‌گرایی","حواس‌پرتی"],
  "خنثی":["آرام","نرمال","تمرکز خالی"],
  "خانواده (دعوای پدر و مادر)":["اضطراب از دعوا","ترس و تنش","احساس گناه","درماندگی","نیاز به آرامش"],
  "کار و روزمره":["فشار کارها","احساس عقب‌ماندن","ترس از اشتباه","بی‌انگیزگی","خستگی ذهنی"],
  "آینده":["ترس از آینده","بی‌اطمینانی","ناامیدی","نگرانی از تنها ماندن","امید کم‌رنگ"],
  "تحصیل":["ترس از قضاوت","احساس ناکافی بودن","فشار ضرب‌الاجل","کمال‌گرایی در درس","غرور از پیشرفت"],
  "همسر: دیوار سکوت":["دیوار سکوت","نادیده‌گرفته‌شدن","تنهایی کنار همسر","اضطراب انتظار پاسخ","نامرئی بودن","ترس از رها شدن"],
  "همسر: محبت و نوازش":["تشنه‌ی محبت","نیاز به نوازش و نزدیکی","احساس طردشدگی","شرم از خواستن","دلتنگی در کنار هم","نیاز به اطمینان"],
  "همسر: امنیت و آینده":["ناامنی روانی","ناامنی مالی","ناامنی عاطفی و روحی","بی‌اطمینانی از آینده‌ی مشترک","تنها ماندن در تصمیم‌ها","بی‌پشتوانگی"],
  "واکنش‌های من":["وسوسه‌ی پیگیری و اصرار","حساسیت به نشانه‌ها","خودسرزنشی: من زیادی می‌خواهم؟","خشم و دلخوری","غم و سوگ رابطه","خستگی از تلاش","تردید درباره‌ی ماندن","آرام کردن خودم"]
 }
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const LST={shield:LS("l_shield",DEF.shield.slice()),activity:LS("l_activity",LS("acts_v1",DEF.activity.slice())),goal:LS("l_goal",DEF.goal.slice()),rec:LS("l_rec",DEF.rec.slice()),help:LS("l_help",DEF.help.slice())};
if(!LST.activity.includes(PROC))LST.activity.push(PROC);
const FEEL=(()=>{let f=LS("feel_v3",null);if(f)return f;f=LS("feel_v2",null);
 if(f){delete f["همسر و رابطه"];Object.keys(DEF.feel).slice(-4).forEach(k=>f[k]=DEF.feel[k].slice())}else f=JSON.parse(JSON.stringify(DEF.feel));
 SV("feel_v3",f);return f})();
const HUES=[150,12,205,265,40,330,180,95,25,240,300,60,120,350];
const hue=c=>HUES[Math.max(0,Object.keys(FEEL).indexOf(c))%HUES.length];

function fillSel(k,sel){
  const e=$(k);if(!e)return;const cur=sel||e.value;
  e.innerHTML=LST[k].map(v=>`<option>${esc(v)}</option>`).join("");
  if(LST[k].includes(cur))e.value=cur;
  if(k==="activity")toggle();
}
function toggle(){const p=$("activity").value===PROC;$("gWrap").style.display=p?"none":"";$("pWrap").style.display=p?"none":""}
["shield","activity","goal","rec"].forEach(k=>fillSel(k));
$("env").innerHTML=DEF.env.map(v=>`<option>${v}</option>`).join("");
$("activity").onchange=toggle;

const val={perf:4,press:3};
function scale(id,key){
  const el=$(id);
  el.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join("");
  const paint=()=>[...el.children].forEach(b=>b.classList.toggle("sel",+b.dataset.n===val[key]));
  el.onclick=e=>{if(e.target.dataset.n){val[key]=+e.target.dataset.n;paint()}};
  paint();
}
scale("perf","perf");scale("press","press");

const picked=new Map();let curCat=null;
function drawFeel(){
  const has=c=>[...picked.values()].includes(c)?" ✓":"";
  $("cats").innerHTML=Object.keys(FEEL).map(c=>`<button type="button" class="chip cat${c===curCat?" sel":""}" style="--h:${hue(c)}" data-c="${esc(c)}">${esc(c)}${has(c)}</button>`).join("");
  $("feels").innerHTML=curCat?(FEEL[curCat]||[]).map(f=>`<button type="button" class="chip cat${picked.has(f)?" sel":""}" style="--h:${hue(curCat)}" data-f="${esc(f)}">${esc(f)}</button>`).join(""):"";
}
$("cats").onclick=e=>{const c=e.target.dataset.c;if(c){curCat=curCat===c?null:c;drawFeel()}};
$("feels").onclick=e=>{const f=e.target.dataset.f;if(f){picked.has(f)?picked.delete(f):picked.set(f,curCat);drawFeel()}};
drawFeel();

// ویرایش گزینه‌ها
const TT={shield:"ویرایش سپر دفاعی",activity:"ویرایش فعالیت‌ها",goal:"ویرایش هدف (دقیقه)",rec:"ویرایش زمان ریکاوری (دقیقه)",feel:"ویرایش احساسات",help:"ویرایش راهکارهای کمک‌کننده"};
let edKey=null,ev={t:null,after:0,help:new Set()};
function drawEd(){
  const k=edKey,b=$("sBody");
  if(k==="theme"){drawTheme();return}
  const chip=(t,r,lock,sel)=>`<span class="chip${sel?" sel":""}" ${sel===undefined?"":`data-sel="${esc(t)}"`}>${esc(t)}${lock?"":` <b class="x" data-rm="${esc(r)}">✕</b>`}</span>`;
  const add=(id,ph,act,num)=>`<div class="addrow"><input id="${id}" ${num?'inputmode="numeric"':""} placeholder="${ph}"><button type="button" data-act="${act}">افزودن</button></div>`;
  $("sTitle").textContent=TT[k];
  if(k==="feel"){
    b.innerHTML=`<label>دسته‌ها (برای دیدن و ویرایش احساس‌ها، روی یک دسته بزن)</label><div class="chips">${Object.keys(FEEL).map(c=>chip(c,"c:"+c,false,c===curCat)).join("")}</div>${add("edCat","دسته‌ی جدید","addcat")}`+
    (curCat?`<label>احساس‌های «${esc(curCat)}»</label><div class="chips">${FEEL[curCat].map(f=>chip(f,"f:"+f,false)).join("")}</div>${add("edFeel","احساس جدید","addfeel")}`:"");
  }else{
    const num=k==="goal"||k==="rec";
    b.innerHTML=`<div class="chips">${LST[k].map(v=>chip(v,v,k==="activity"&&v===PROC)).join("")}</div>`+(k==="activity"?`<div class="meta">«اهمال‌کاری» ثابت است، چون هدف و عملکرد را مخفی می‌کند.</div>`:"")+add("edIn",num?"عدد جدید (دقیقه)":"گزینه‌ی جدید","add",num)+(k==="help"&&ev.t?`<button type="button" class="ghost" data-act="back">بازگشت به ارزیابی</button>`:"");
  }
}
function drawEval(){
  $("sTitle").textContent="این ثبت چقدر کمک کرد؟";
  $("sBody").innerHTML=`<label>الان شدت فشار احساسی‌ات چقدر است؟ (۱ تا ۵)</label><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="${ev.after===n?"sel":""}" data-a="${n}">${n}</button>`).join("")}</div>
  <label>چه چیزی کمک کرد؟ (چند گزینه می‌شود) <button type="button" class="ed" data-ed="help">✎ ویرایش</button></label>
  <div class="chips">${LST.help.map(h=>`<span class="chip${ev.help.has(h)?" sel":""}" data-h="${esc(h)}">${esc(h)}</span>`).join("")}</div>
  <button type="button" class="btn" data-act="evsave">ثبت اثر</button>`;
}
function openEval(tm){ev={t:tm,after:0,help:new Set()};edKey="eval";drawEval();$("sheet").hidden=false}
function openEd(k){edKey=k;drawEd();$("sheet").hidden=false}
document.addEventListener("click",e=>{const k=e.target.dataset&&e.target.dataset.ed;if(k)openEd(k)});
$("sClose").onclick=()=>{$("sheet").hidden=true};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};
$("sBody").onkeydown=e=>{if(e.key==="Enter"){const a=e.target.parentNode&&e.target.parentNode.querySelector("[data-act]");if(a)a.click()}};
$("sBody").onclick=e=>{
  const t=e.target,rm=t.dataset.rm,act=t.dataset.act,sel=t.dataset.sel,k=edKey;
  const v=id=>($(id)&&$(id).value||"").trim();
  if(edKey==="theme"){themeClick(t,act);return}
  if(act==="back"){edKey="eval";drawEval();return}
  if(edKey==="eval"){
    if(t.dataset.a)ev.after=+t.dataset.a;
    else if(t.dataset.h!==undefined){ev.help.has(t.dataset.h)?ev.help.delete(t.dataset.h):ev.help.add(t.dataset.h)}
    else if(act==="evsave"){
      if(!ev.after){return}
      const a=load(),x=a.find(y=>y.t===ev.t);
      if(x){x.after=ev.after;x.helped=[...ev.help].join("، ")}
      SV(KEY,a);$("sheet").hidden=true;render();$("msg").textContent="اثر این ثبت هم نوشته شد.";return;
    }
    drawEval();return;
  }
  if(sel!==undefined){curCat=sel;drawFeel();drawEd();return}
  if(rm!==undefined){
    if(k==="feel"){
      if(rm.startsWith("c:")){const c=rm.slice(2);delete FEEL[c];for(const [f,cc] of [...picked])if(cc===c)picked.delete(f);if(curCat===c)curCat=null}
      else{const f=rm.slice(2);FEEL[curCat]=FEEL[curCat].filter(x=>x!==f);picked.delete(f)}
      SV("feel_v3",FEEL);drawFeel();
    }else{
      if(k==="activity"&&rm===PROC)return;
      LST[k]=LST[k].filter(x=>x!==rm);SV("l_"+k,LST[k]);fillSel(k);
    }
    drawEd();return;
  }
  if(act==="addcat"){const n=v("edCat");if(n&&!FEEL[n]){FEEL[n]=[];curCat=n;SV("feel_v3",FEEL);drawFeel()}}
  else if(act==="addfeel"){const n=v("edFeel");if(n&&curCat&&!FEEL[curCat].includes(n)){FEEL[curCat].push(n);SV("feel_v3",FEEL);drawFeel()}}
  else if(act==="add"){
    let n=v("edIn");const num=k==="goal"||k==="rec";
    if(num)n=n.replace(/\D/g,"");
    if(n&&!LST[k].includes(n)){LST[k].push(n);if(num)LST[k].sort((a,b)=>a-b);SV("l_"+k,LST[k]);fillSel(k,n)}
  }
  drawEd();
};

// گزارش پایان روز
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const topN=(arr,n)=>{const m={};arr.forEach(k=>m[k]=(m[k]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)};
function report(){
  const td=sameDay(vd,new Date()),w=td?"امروز":"در این روز",today=dstr(vd),a=load().filter(x=>dstr(new Date(x.t))===today);
  if(!a.length)return td?"<p>امروز هنوز ثبتی نداری. هر وقت آماده بودی، یک ثبت کوچک کافی است.</p>":"<p>در این روز ثبتی نبود.</p>";
  const e=a.filter(x=>x.after),P=[];
  P.push(`<p>📝 ${a.length} ثبت ${w}${e.length<a.length?` (اثر ${a.length-e.length} مورد هنوز ثبت نشده)`:""}</p>`);
  const fl=topN(a.flatMap(x=>x.feel?x.feel.split("، "):[]),3);
  if(fl.length)P.push(`<p>🌿 پرتکرارترین احساس‌ها: ${fl.map(f=>esc(f[0])+" ("+f[1]+")").join("، ")}</p>`);
  const pr=a.filter(x=>x.activity===PROC).length;
  if(pr)P.push(`<p>⏳ ${pr} ثبت در حال اهمال‌کاری بود.</p>`);
  if(!e.length){P.push("<p><b>اثر ثبت‌ها:</b> هنوز ارزیابی نشده. روی «ثبت اثر» هر یادداشت بزن تا ببینیم چقدر کمک کرده.</p>");return P.join("")}
  const b=avg(e.map(x=>x.press)),c=avg(e.map(x=>x.after)),d=b-c;
  const better=e.filter(x=>x.after<x.press).length,worse=e.filter(x=>x.after>x.press).length,same=e.length-better-worse;
  P.push(`<p>📉 میانگین فشار احساسی: ${b.toFixed(1)} قبل ← ${c.toFixed(1)} بعد</p><p>✅ ${better} بهتر · ➖ ${same} بدون تغییر · ⚠️ ${worse} بدتر</p>`);
  const h=topN(e.filter(x=>x.after<x.press&&x.helped).flatMap(x=>x.helped.split("، ")),3);
  if(h.length)P.push(`<p>💡 بیشتر کمک کرد: ${h.map(x=>esc(x[0])).join("، ")}</p>`);
  P.push("<p><b>"+(d>=0.5?w+" بعد از ثبت‌ها فشار احساسی‌ات به‌طور میانگین پایین آمد؛ ثبت کردن به نظر برایت مؤثر بود.":d>-0.5?"تغییر محسوسی در فشار دیده نشد؛ این هم اطلاعات خوبی است برای اینکه فردا چه چیز دیگری امتحان کنی.":"بعد از ثبت‌ها فشار بیشتر شد. شاید لحظه‌های سختی بودند؛ اگر تکرار شد، با یک آدم مطمئن هم حرف بزن.")+"</b></p>");
  return P.join("");
}
$("repBtn").onclick=()=>{$("rep").innerHTML=report()};

// تاریخ و سلام
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const day=d=>d.toLocaleDateString("en-US",{weekday:"long"});
function tick(){
  const d=new Date(),h=d.getHours();
  $("hi").textContent=h<5?"شب بخیر":h<12?"صبح بخیر":h<17?"ظهر بخیر":h<21?"عصر بخیر":"شب بخیر";
  $("now").textContent=`${dstr(d)} · ${day(d)} · ساعت ${pad(h)}:${pad(d.getMinutes())}`;
}
tick();setInterval(tick,30000);

// تشخیص گفتار
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false;
if(!SR){$("msg").textContent="این مرورگر تشخیص گفتار ندارد؛ از Chrome استفاده کن یا با کیبورد بنویس.";$("mic").disabled=true}
else{
  rec=new SR();rec.lang="fa-IR";rec.continuous=true;rec.interimResults=true;
  let base="";
  rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;$("text").value=(base+" "+s).trim()};
  rec.onend=()=>{on=false;$("mic").classList.remove("on");$("msg").textContent="ضبط تمام شد. اگر لازم بود ویرایش کن و ذخیره بزن."};
  rec.onerror=e=>{$("msg").textContent="خطای میکروفون: "+e.error+" (اجازه‌ی میکروفون و اینترنت را چک کن)"};
  $("mic").onclick=()=>{
    if(on){rec.stop();return}
    base=$("text").value;on=true;$("mic").classList.add("on");$("msg").textContent="دارم گوش می‌دهم… آرام و بلند بگو";
    try{rec.start()}catch(e){}
  };
}

// ذخیره و نمایش
const KEY="feelings_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
const KIND=["ثبت شد. همین که احساست را گفتی یعنی داری کنترل را برمی‌گردانی.","ممنون که به خودت گوش دادی. یک قدم کوچک هم قدم است.","احساس تو قابل‌شنیدن است. ثبت شد."];
let vd=new Date();
const sameDay=(a,b)=>dstr(a)===dstr(b);
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
function navUI(){
  const td=sameDay(vd,new Date());
  $("lTitle").textContent=td?"یادداشت‌های امروز":`یادداشت‌های ${dstr(vd)} · ${day(vd)}`;
  $("dPick").value=dkey(vd);$("dPick").max=dkey(new Date());
  $("dToday").hidden=td;
  const m={};
  load().forEach(x=>{const d=new Date(x.t),k=dkey(d);(m[k]=m[k]||{n:0,d}).n++});
  $("dDays").innerHTML=Object.keys(m).sort().reverse().slice(0,14).map(k=>`<button type="button" class="chip${k===dkey(vd)?" sel":""}" data-day="${k}">${k.slice(8)}/${k.slice(5,7)} · ${m[k].n} ثبت</button>`).join("");
}
function goDay(d){vd=d;$("rep").innerHTML="";render()}
$("dPrev").onclick=()=>{const d=new Date(vd);d.setDate(d.getDate()-1);goDay(d)};
$("dNext").onclick=()=>{const d=new Date(vd);d.setDate(d.getDate()+1);if(dkey(d)<=dkey(new Date()))goDay(d)};
$("dToday").onclick=()=>goDay(new Date());
$("dPick").onchange=e=>{const v=e.target.value;if(v&&v<=dkey(new Date()))goDay(fromKey(v))};
$("dDays").onclick=e=>{const k=e.target.dataset.day;if(k)goDay(fromKey(k))};
function render(){
  navUI();
  const today=dstr(vd);
  const a=load().filter(x=>dstr(new Date(x.t))===today).reverse();
  $("list").innerHTML=a.length?a.map(x=>{
    const d=new Date(x.t),h=hue((x.cat||"").split("، ")[0]);
    return `<div class="ent" style="--h:${h}"><span class="dot"></span><div>${x.feel?"<b>"+esc(x.feel)+"</b>"+(x.text?" — ":""):""}${esc(x.text)}
    <div class="meta">${pad(d.getHours())}:${pad(d.getMinutes())} · ${esc(x.shield)} · ${esc(x.activity)}${x.perf?" · عملکرد "+x.perf:""} · فشار ${x.press} · ریکاوری ${x.rec}${x.env?" · "+esc(x.env):""}${x.after?" · پس از ثبت: فشار "+x.press+" به "+x.after:""}</div>${x.after?"":`<button type="button" class="ed" data-ev="${x.t}">✎ ثبت اثر</button>`}</div><button class="del" data-t="${x.t}">حذف</button></div>`}).join(""):'<div class="meta" style="padding:10px 0">'+(sameDay(vd,new Date())?"هنوز چیزی ثبت نشده؛ هر وقت آماده بودی.":"در این روز چیزی ثبت نشده.")+'</div>';
}
$("list").onclick=e=>{const d=e.target.dataset,t=d.t;if(d.ev){openEval(d.ev);return}if(t){SV(KEY,load().filter(x=>x.t!==t));render()}};
$("save").onclick=()=>{
  const text=$("text").value.trim();
  if(!text&&!picked.size){$("msg").textContent="اول احساست را انتخاب کن، بگو یا بنویس.";return}
  if(on)rec.stop();
  const p=$("activity").value===PROC,a=load();
  a.push({t:new Date().toISOString(),text,shield:$("shield").value,activity:$("activity").value,goal:p?"":$("goal").value,perf:p?"":val.perf,env:$("env").value,feel:[...picked.keys()].join("، "),cat:[...new Set(picked.values())].join("، "),press:val.press,rec:$("rec").value});
  SV(KEY,a);$("text").value="";picked.clear();curCat=null;drawFeel();
  $("msg").textContent=KIND[a.length%KIND.length];vd=new Date();render();
};

function rows(){
  const h=["تاریخ","روز","ساعت","احساسات","سپر دفاعی","فعالیت","هدف","عملکرد","زمان ریکاوری","شدت فشار احساسی","تنش محیطی","دسته احساس","احساس‌ها","فشار بعد از ثبت","راهکارهای کمک‌کننده"];
  const r=load().map(x=>{const d=new Date(x.t);return[dstr(d),day(d),d.getHours(),x.text,x.shield,x.activity,x.goal,x.perf,x.rec,x.press,x.env||"",x.cat||"",x.feel||"",x.after||"",x.helped||""]});
  return[h,...r];
}
$("csv").onclick=()=>{
  const s="\ufeff"+rows().map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([s],{type:"text/csv;charset=utf-8"}));
  a.download="feelings.csv";a.click();
};
$("copy").onclick=async()=>{
  const s=rows().map(r=>r.map(c=>String(c).replace(/[\t\n]/g," ")).join("\t")).join("\n");
  try{await navigator.clipboard.writeText(s);$("msg").textContent="کپی شد؛ در Sheets بچسبان."}catch(e){$("msg").textContent="کپی نشد؛ از دانلود CSV استفاده کن."}
};
let timer=null;
$("rem").onclick=async()=>{
  if(timer){clearInterval(timer);timer=null;$("rem").textContent="یادآوری هر یک ساعت: خاموش";return}
  if("Notification" in window&&Notification.permission!=="granted")await Notification.requestPermission();
  timer=setInterval(()=>{
    if("Notification" in window&&Notification.permission==="granted")new Notification("یک ساعت گذشت 🎙 الان چه حسی داری؟");
    else $("msg").textContent="یک ساعت گذشت؛ احساست را ثبت کن.";
  },3600000);
  $("rem").textContent="یادآوری هر یک ساعت: روشن (صفحه باید باز بماند)";
};
// ظاهر برنامه: رنگ و پس‌زمینه
const ACC=[
 {n:"سبز مریمی",l:["#5f9585","#8f86bd"],d:["#86bfae","#a79fd6"]},
 {n:"آبی دریا",l:["#4f8fb0","#7a9fd6"],d:["#7fb8d6","#9fb4e6"]},
 {n:"یاسی",l:["#8f7bc0","#c08fb8"],d:["#b3a2e0","#d9a8cf"]},
 {n:"گلبهی",l:["#c47a8a","#e0a07a"],d:["#e3a0ae","#efb99a"]},
 {n:"شنی",l:["#b08a5a","#8fa07a"],d:["#d3b184","#aebd98"]}
];
const BGS=[
 {n:"کرم",l:["#f4ede6","#e6eef0"],d:["#1d2433","#252b3d"]},
 {n:"طلوع",l:["#fbe8dc","#e8dff0"],d:["#2a2233","#1f2a3d"]},
 {n:"دریا",l:["#e3f0f4","#d6e4f0"],d:["#16262f","#1d2f3d"]},
 {n:"جنگل",l:["#e8f0e4","#dce9e2"],d:["#17261f","#1e2f29"]},
 {n:"گل‌برگ",l:["#f8e6ea","#efe3f2"],d:["#2b1f2a","#2a2338"]},
 {n:"ساده",l:["#f5f5f3","#f5f5f3"],d:["#1b1d22","#1b1d22"]}
];
const TH=Object.assign({mode:"auto",acc:0,col:"#5f9585",bg:0,img:false},LS("theme_v1",{}));
const saveTH=()=>SV("theme_v1",TH);
const root=document.documentElement,origTheme=root.getAttribute("data-theme");
function isDark(){
  if(TH.mode==="dark")return true;
  if(TH.mode==="light")return false;
  if(origTheme==="dark")return true;
  if(origTheme==="light")return false;
  return !!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
}
const lum=h=>{const n=parseInt(h.slice(1),16);return(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255};
function applyTheme(){
  const dk=isDark(),s=root.style;
  if(TH.mode==="auto"){origTheme===null?root.removeAttribute("data-theme"):root.setAttribute("data-theme",origTheme)}else root.setAttribute("data-theme",TH.mode);
  const a=ACC[TH.acc],c1=a?(dk?a.d:a.l)[0]:TH.col,c2=a?(dk?a.d:a.l)[1]:TH.col;
  s.setProperty("--ac",c1);s.setProperty("--ac2",c2);
  s.setProperty("--acT",(lum(c1)+lum(c2))/2>0.6?"#14201c":"#fff");
  const g=BGS[TH.bg]||BGS[0],c=dk?g.d:g.l;
  s.setProperty("--bg1",c[0]);s.setProperty("--bg2",c[1]);
  let img="";try{img=TH.img?localStorage.getItem("bgimg_v1")||"":""}catch(e){}
  const ov=dk?"rgba(20,25,35,.62)":"rgba(255,255,255,.55)";
  document.body.style.background=img?`linear-gradient(${ov},${ov}),url("${img}") center/cover fixed`:"";
}
function drawTheme(){
  $("sTitle").textContent="ظاهر برنامه";
  const dk=isDark();
  $("sBody").innerHTML=`<label>حالت</label><div class="chips">${[["auto","خودکار"],["light","روشن"],["dark","تیره"]].map(m=>`<span class="chip${TH.mode===m[0]?" sel":""}" data-mode="${m[0]}">${m[1]}</span>`).join("")}</div>
  <label>رنگ اصلی (یا رنگ دلخواه خودت)</label><div class="chips" style="align-items:center">${ACC.map((a,i)=>`<span class="sw${TH.acc===i?" sel":""}" data-acc="${i}" title="${a.n}" style="background:linear-gradient(135deg,${a.l[0]},${a.l[1]})"></span>`).join("")}<input type="color" id="thCol" value="${TH.col}" style="width:46px;height:40px;padding:2px"></div>
  <label>پس‌زمینه</label><div class="chips">${BGS.map((g,i)=>`<span class="bgsw${TH.bg===i&&!TH.img?" sel":""}" data-bg="${i}" style="background:linear-gradient(135deg,${(dk?g.d:g.l)[0]},${(dk?g.d:g.l)[1]})">${g.n}</span>`).join("")}</div>
  <button type="button" class="ghost" data-act="img">🖼 انتخاب عکس از گالری</button>${TH.img?`<button type="button" class="ghost" data-act="rmimg">حذف عکس پس‌زمینه</button>`:""}`;
}
function themeClick(t,act){
  const d=t.dataset;
  if(d.mode)TH.mode=d.mode;
  else if(d.acc!==undefined)TH.acc=+d.acc;
  else if(d.bg!==undefined){TH.bg=+d.bg;TH.img=false}
  else if(act==="img"){$("thImg").click();return}
  else if(act==="rmimg"){TH.img=false;try{localStorage.removeItem("bgimg_v1")}catch(e){}}
  else return;
  saveTH();applyTheme();drawTheme();
}
$("sBody").oninput=e=>{if(e.target.id==="thCol"){TH.acc=-1;TH.col=e.target.value;saveTH();applyTheme()}};
$("thImg").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    try{localStorage.setItem("bgimg_v1",c.toDataURL("image/jpeg",.72));TH.img=true;saveTH();applyTheme();if(edKey==="theme")drawTheme()}
    catch(err){$("msg").textContent="حافظه برای ذخیره‌ی این عکس کافی نیست؛ یک عکس کوچک‌تر انتخاب کن."}
  };im.src=r.result};
  r.readAsDataURL(f);e.target.value="";
};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
applyTheme();
render();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
