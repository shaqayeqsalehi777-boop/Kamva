name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png www/ 2>/dev/null || true
      - name: Add Android project
        run: npx cap add android
      - name: Patch manifest
        run: python3 patch.py
      - name: App icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon-only.png
          cp icon-1024.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#cfe3da' --iconBackgroundColorDark '#1d2433'
      - name: Sync
        run: npx cap sync android
      - name: Android SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ehsas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
