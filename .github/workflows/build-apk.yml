name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json sw.js icon-192.png icon-512.png apple-touch-icon.png www/ 2>/dev/null || true
      - name: Add Android project
        run: npx cap add android
      - name: Patch manifest
        run: python3 patch.py
      - name: App icon
        continue-on-error: true
        run: unzip -o icons.zip -d android/app/src/main/res/
      - name: Sync
        run: npx cap sync android
      - name: Android SDK packages
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          code=$?
          tail -n 40 build.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Execution failed|not found" -A2 build.log | head -12 | tr '\n' ' ')
            echo "::error title=Gradle failure::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ehsas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
